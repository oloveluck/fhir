# Builds the Python client's wheels: one per platform, each carrying the toolkit's executable,
# so that `pip install` is the whole setup and no Racket is needed to use it.
#
# Runs when a version is tagged (v0.1.0), when started by hand, and on a push to main that
# changes the release machinery itself (this file, release/, the build script, the wheel's
# builder and its test) — never on an ordinary push: three machines build for ten minutes.
# The family's other repositories are installed at the commits release/family.lock names
# (release/lock-family.sh writes it before a release is tagged). Each wheel is installed into a
# clean environment and the client's tests are run against it with nothing else on the PATH
# (clients/python/test_wheel.py). The wheels are kept as the run's artifacts. They are published
# to the Python Package Index only from a version tag, and only once the repository says so
# (the variable PUBLISH_TO_PYPI: release/RELEASING.md); that job has not run yet.
name: wheels

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/wheels.yml"
      - "release/**"
      - ".gitattributes"
      - "build-tools.sh"
      - "clients/python/build_wheel.py"
      - "clients/python/test_wheel.py"
      - "clients/python/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

# a newer push replaces a run that is still going: one verdict for the latest tree
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        # the oldest Linux image offered (a wheel is tagged for the C library it was built
        # against, and installs on that or anything newer); macOS on Apple silicon and on Intel
        os: [ubuntu-22.04, macos-15, macos-15-intel]
        experimental: [false]
        include:
          # Racket for the runner's own processor: left to its default the setup installs the Intel
          # build on Apple silicon too, and the wheel would be an Intel one under an arm64 name
          - os: macos-15
            racket: arm64
          # Windows has never been built: this job says how far it gets, and does not fail the run
          - os: windows-2022
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
          variant: CS
          distribution: full
          architecture: ${{ matrix.racket || 'x64' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the store needs SQLite 3.45 or newer; the runner's (Ubuntu 22.04) and the one Racket's
      # own distribution carries (macOS) are older. Built here and put where Racket loads it
      # first, it is also what `raco distribute` copies into the standalone build.
      - name: A SQLite of the toolkit's own
        run: release/build-sqlite.sh
      - name: Install the packages at the locked commits
        run: release/install-family.sh
      - name: The function server's own tests
        continue-on-error: ${{ matrix.experimental }}
        run: raco test fhir-api
      - name: Build the standalone executable
        run: ./build-tools.sh dist fhir-api
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip wheel
          python clients/python/build_wheel.py dist --out wheels
      - name: Test the wheel where nothing else is installed
        run: python clients/python/test_wheel.py wheels --with pandas --with ipython --with fhir.resources
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheels/*.whl
          if-no-files-found: error

  # The wheels of a tagged version, sent to the Python Package Index. Off until the repository
  # variable PUBLISH_TO_PYPI is "true" and PyPI trusts this workflow (release/RELEASING.md): it
  # uploads with a short-lived token PyPI gives this job, so no password is kept anywhere.
  publish:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
