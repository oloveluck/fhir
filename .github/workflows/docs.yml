# Builds the Scribble documentation and publishes it to GitHub Pages.
# The family's packages are not on pkgs.racket-lang.org yet, so the ones this
# package builds on are installed from their GitHub repositories first.
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
          variant: CS
          distribution: full
      - name: Install the packages (this repository's and the family packages it builds on, in one command)
        run: |
          raco pkg install --no-docs --batch --auto \
            "./fhir" \
            "./fhir-spec" \
            "./fhir-tx" \
            "./fhir-validation" \
            "./fhir-server" \
            "./fhir-lsp" \
            "./fhir-mcp" \
            "https://github.com/oloveluck/fhirpath.git" \
            "https://github.com/oloveluck/vcl.git" \
            "https://github.com/oloveluck/cql.git" \
            "https://github.com/oloveluck/fml.git" \
            "https://github.com/oloveluck/fsh.git"
      - name: Test the terminology package and the server seams it uses
        run: |
          raco test fhir-tx/terminology/index.rkt fhir-tx/terminology/service.rkt fhir-tx/terminology/operations.rkt fhir-tx/tx-cli.rkt
          raco test fhir/lang/support.rkt fhir/lang/declared.rkt fhir/parallel.rkt fhir/registry.rkt fhir/sd/operations.rkt fhir/sd/logical.rkt fhir/serialize/jsexpr-util.rkt fhir/codegen/gen.rkt fhir-server/http/router.rkt fhir-server/capability/operations.rkt fhir-server/tests/operations-http-test.rkt
          raco fhir roundtrip-tck r5
          raco fhir roundtrip-tck r4
      - name: The language server (the transport, the dispatch, each language's adapter)
        run: |
          raco test fhir-lsp/lsp/jsonrpc.rkt fhir-lsp/lsp/diagnostics.rkt fhir-lsp/lsp/languages.rkt fhir-lsp/lsp/fsh-symbols.rkt fhir-lsp/lsp/fsh-complete.rkt fhir-lsp/lsp/lang-symbols.rkt fhir-lsp/lsp/server.rkt fhir-lsp/tests/languages-test.rkt
          raco fhir-lsp languages
      - name: The MCP server (the tools over the operations and languages, the dispatch)
        run: |
          raco test fhir-mcp/mcp/tools.rkt fhir-mcp/mcp/resources.rkt fhir-mcp/mcp/server.rkt fhir-mcp/tests/tools-test.rkt
          raco fhir-mcp tools | head -c 400
      - name: The terminology conformance suite (floor-ratcheted)
        run: raco fhir-tx tck
      - name: The server and validation suites (the stores, generated servers, IG oracles, the validator differential)
        run: |
          raco test fhir-validation/conformance/tests/validate-test.rkt fhir-validation/conformance/tests/validate-corpus-test.rkt fhir-validation/conformance/tests/snapshot-test.rkt fhir-validation/conformance/tests/snapshot-conformance-test.rkt fhir-validation/tests/validate-diff-test.rkt fhir-validation/tests/ig-validation-r4-test.rkt fhir-validation/tests/ig-fhirpath-r4-test.rkt
          raco test fhir-server/store/ig-plan.rkt fhir-server/store/ig-capability.rkt fhir-server/store/search-index.rkt fhir-server/tests/capability-lang-test.rkt fhir-server/tests/http-test.rkt fhir-server/tests/fhir-store-test.rkt fhir-server/tests/store-http-test.rkt fhir-server/tests/audit-bundle-test.rkt fhir-server/tests/ig-search-r4-test.rkt fhir-server/tests/ig-server-r4-test.rkt fhir-server/tests/fsh-ig-server-r4-test.rkt fhir-server/tests/measure-server-r4-test.rkt
      - name: Build the documentation
        run: |
          raco scribble +m --html --dest site --dest-name index.html --redirect-main https://docs.racket-lang.org/ docs/index.scrbl
          raco scribble +m --html --dest site/fhir --dest-name index.html --redirect-main https://docs.racket-lang.org/ fhir/scribblings/fhir.scrbl
          raco scribble +m --html --dest site/fhir-tx --dest-name index.html --redirect-main https://docs.racket-lang.org/ fhir-tx/scribblings/fhir-tx.scrbl
          raco scribble +m --html --dest site/fhir-validation --dest-name index.html --redirect-main https://docs.racket-lang.org/ fhir-validation/scribblings/fhir-validation.scrbl
          raco scribble +m --html --dest site/fhir-server --dest-name index.html --redirect-main https://docs.racket-lang.org/ fhir-server/scribblings/fhir-server.scrbl
          raco scribble +m --html --dest site/fhir-lsp --dest-name index.html --redirect-main https://docs.racket-lang.org/ fhir-lsp/scribblings/fhir-lsp.scrbl
          raco scribble +m --html --dest site/fhir-mcp --dest-name index.html --redirect-main https://docs.racket-lang.org/ fhir-mcp/scribblings/fhir-mcp.scrbl
      # Publish: the built site goes to the gh-pages branch, which GitHub serves as the Pages site
      # (enabled automatically for a public repository; otherwise choose "Deploy from a branch:
      # gh-pages" once under Settings > Pages).
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
