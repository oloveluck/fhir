# Inferno execution script: the US Core 8.0.0 "US Core FHIR API" group (group 4) against a server
# generated by `raco fhir serve-ig hl7.fhir.us.core-8.0.0.tgz --bearer <token>`.
# Modeled on the test kit's own execution_scripts/reference_server/fhir_api_only/us_core_server_800.yaml
# (us-core-test-kit v1.2.0). run-inferno.sh substitutes FHIR_TOOLS_URL and FHIR_TOOLS_TOKEN.
sessions:
  - suite: us_core_v800

steps:
  - state_description: US Core Server 8.0.0 session created
    status: created
    start_run:
      runnable: 4
      inputs:
        url: FHIR_TOOLS_URL
        smart_auth_info:
          access_token: FHIR_TOOLS_TOKEN
        patient_ids: child-example,deceased-example,example,infant-example
    timeout: 1800
    action_description: Run Group 4 US Core FHIR API

  - state_description: Finished Group 4 US Core FHIR API
    status: done
    last_completed: 4
    action: "END_SCRIPT"
    action_description: Script Completed
